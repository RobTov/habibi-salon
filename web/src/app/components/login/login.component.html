<div
  class="w-screen min-h-screen flex items-center justify-center bg-gray-50 px-4 sm:px-6 lg:px-8 background-i"
>
  <div class="relative py-3 sm:max-w-xs sm:mx-auto">
    <div
      class="min-h-96 px-8 py-6 mt-4 text-left bg-white rounded-xl shadow-lg"
    >
      <div class="flex flex-col justify-center items-center h-full select-none">
        <div class="flex flex-col items-center justify-center gap-2 mb-8">
          <a href="https://amethgalarcio.web.app/" target="_blank">
            <img src="/img/logo.jpeg" class="w-12" />
          </a>
          <p class="m-0 text-[16px] font-semibold">Inicia Sesión</p>
          <span
            class="m-0 text-xs max-w-[90%] text-center text-[#8B8E98]"
            style="opacity: 0"
          >
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Totam natus
            corrupti nemo doloremque molestiae illo velit amet placeat ab? Ab?
          </span>
        </div>
        <div class="w-full flex flex-col gap-2">
          <label class="font-semibold text-xs text-gray-400">Correo</label>
          <input
            [(ngModel)]="email"
            class="border rounded-lg px-3 py-2 mb-5 text-sm w-full outline-none"
            placeholder="ejemplo@mail.com"
          />
        </div>
      </div>
      <div class="w-full flex flex-col gap-2">
        <label class="font-semibold text-xs text-gray-400">Contraseña</label>
        <input
          type="password"
          class="border rounded-lg px-3 py-2 mb-5 text-sm w-full outline-none"
          placeholder="••••••••"
        />
      </div>
      <div className="mt-5">
        <button
          class="py-1 px-8 bg-blue-500 hover:bg-blue-800 focus:ring-offset-blue-200 text-white w-full transition ease-in duration-200 text-center text-base font-semibold shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 rounded-lg cursor-pointer select-none"
          (click)="login()"
        >
          Login
        </button>
      </div>
    </div>
  </div>
</div>
